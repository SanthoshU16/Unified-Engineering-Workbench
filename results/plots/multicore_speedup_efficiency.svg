<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700">
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dfb27d"/><stop offset="1" stop-color="#9a603b"/></linearGradient>
  <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ec8a4"/><stop offset="1" stop-color="#3a7a5a"/></linearGradient>
  <linearGradient id="bar4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7ab8e0"/><stop offset="1" stop-color="#2e6ea0"/></linearGradient>
</defs>
<rect width="100%" height="100%" fill="#111310"/>
<rect x="24" y="22" width="1072" height="656" rx="16" fill="#191a16" stroke="#39372f"/>

<!-- Title -->
<text x="56" y="65" fill="#f1eee6" font-size="22" font-weight="700" font-family="Inter,system-ui,sans-serif">Multicore Benchmark — Execution Time &amp; Speedup</text>
<text x="56" y="94" fill="#aaa69c" font-size="13" font-family="Inter,system-ui,sans-serif">2,000 thermal cases · mesh N = 100 · seed 42 · Apple M2 · 16 GiB · Clang 21 · -O3 · 5 reps · 1 warm-up pass</text>

<!-- Legend -->
<rect x="750" y="48" width="14" height="14" rx="3" fill="url(#bar)"/><text x="772" y="60" fill="#c9c2b4" font-size="12" font-family="Inter,system-ui,sans-serif">1 worker</text>
<rect x="840" y="48" width="14" height="14" rx="3" fill="url(#bar2)"/><text x="862" y="60" fill="#c9c2b4" font-size="12" font-family="Inter,system-ui,sans-serif">2 workers</text>
<rect x="940" y="48" width="14" height="14" rx="3" fill="url(#bar4)"/><text x="962" y="60" fill="#c9c2b4" font-size="12" font-family="Inter,system-ui,sans-serif">4 workers</text>

<!-- Chart area -->
<rect x="110" y="150" width="900" height="390" rx="8" fill="#141510" stroke="#34332c"/>

<!-- Y-axis gridlines (time axis, max ~6ms) -->
<line x1="110" y1="540" x2="1010" y2="540" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="544" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">0</text>
<line x1="110" y1="462" x2="1010" y2="462" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="466" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">1.3</text>
<line x1="110" y1="384" x2="1010" y2="384" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="388" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">2.6</text>
<line x1="110" y1="306" x2="1010" y2="306" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="310" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,sans-serif">3.9</text>
<line x1="110" y1="228" x2="1010" y2="228" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="232" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">5.2</text>
<line x1="110" y1="150" x2="1010" y2="150" stroke="#302f29" stroke-dasharray="3 5"/>
<text x="96" y="154" text-anchor="end" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">6.5</text>

<!-- Y-axis label -->
<text x="30" y="350" fill="#aaa69c" font-size="13" font-family="Inter,system-ui,sans-serif" transform="rotate(-90,30,350)">Median solve time (ms)</text>

<!-- 1 worker bar: 5.22ms → height = (5.22/6.5)*390 = 313 → y = 540-313 = 227 -->
<rect x="200" y="227" width="90" height="313" rx="6" fill="url(#bar)"/>
<text x="245" y="216" text-anchor="middle" fill="#f1eee6" font-size="14" font-weight="700" font-family="ui-monospace,monospace">5.22 ms</text>
<text x="245" y="572" text-anchor="middle" fill="#d0cbc0" font-size="13" font-family="Inter,system-ui,sans-serif">1 worker</text>
<text x="245" y="588" text-anchor="middle" fill="#aaa69c" font-size="11" font-family="Inter,system-ui,sans-serif">1.00× speedup</text>

<!-- 2 workers bar: 2.52ms → height = (2.52/6.5)*390 = 151 → y = 540-151 = 389 -->
<rect x="490" y="389" width="90" height="151" rx="6" fill="url(#bar2)"/>
<text x="535" y="378" text-anchor="middle" fill="#f1eee6" font-size="14" font-weight="700" font-family="ui-monospace,monospace">2.52 ms</text>
<text x="535" y="572" text-anchor="middle" fill="#d0cbc0" font-size="13" font-family="Inter,system-ui,sans-serif">2 workers</text>
<text x="535" y="588" text-anchor="middle" fill="#7ec8a4" font-size="11" font-weight="700" font-family="Inter,system-ui,sans-serif">2.07× speedup</text>

<!-- 4 workers bar: 1.33ms → height = (1.33/6.5)*390 = 80 → y = 540-80 = 460 -->
<rect x="780" y="460" width="90" height="80" rx="6" fill="url(#bar4)"/>
<text x="825" y="449" text-anchor="middle" fill="#f1eee6" font-size="14" font-weight="700" font-family="ui-monospace,monospace">1.33 ms</text>
<text x="825" y="572" text-anchor="middle" fill="#d0cbc0" font-size="13" font-family="Inter,system-ui,sans-serif">4 workers</text>
<text x="825" y="588" text-anchor="middle" fill="#7ab8e0" font-size="11" font-weight="700" font-family="Inter,system-ui,sans-serif">3.92× speedup</text>

<!-- Verification badge -->
<rect x="750" y="610" width="300" height="38" rx="8" fill="#1a2e1a" stroke="#3a7a5a"/>
<text x="900" y="634" text-anchor="middle" fill="#7ec8a4" font-size="13" font-weight="700" font-family="Inter,system-ui,sans-serif">✓ Verification PASS · ΔT_max = 0.00e+0 °C ≤ 1e-8</text>

<!-- Efficiency table -->
<rect x="56" y="610" width="640" height="38" rx="8" fill="#1a1f2e" stroke="#2e3a5a"/>
<text x="76" y="634" fill="#aaa69c" font-size="12" font-family="ui-monospace,monospace">1W: η=100.0%    2W: η=103.6%    4W: η=98.0%    Peak speedup: 3.92× at 4 workers</text>
</svg>
