<text x="95" y="145" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">4. CENTRAL FINITE DIFFERENCE GRADIENT CHECK (eps = 1e-6)</text>
<line x1="95" y1="149" x2="770" y2="149" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="170" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Formula: dJ/dtheta ~= [J(theta + eps) - J(theta - eps)] / (2*eps)</text>
<text x="95" y="194" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Evaluating each parameter independently:</text>
<rect x="110" y="200" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="221" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">FD dJ/dw: analytical = -1.20946448,  num = -1.20946448,  diff = 1.13e-10</text>
<rect x="110" y="236" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="257" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">FD dJ/db: analytical = -1.20946448,  num = -1.20946448,  diff = 1.13e-10</text>
<rect x="110" y="272" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="293" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">FD dJ/dv: analytical = -0.71068205,  num = -0.71068205,  diff = 5.25e-11</text>
<rect x="110" y="308" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="329" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">FD dJ/dc: analytical = -1.53788284,  num = -1.53788284,  diff = 1.12e-10</text>
<rect x="95" y="344" width="675" height="34" fill="#f2e6d6" stroke="#a86839" stroke-width="1" rx="4"/>
<text x="110" y="366" fill="#835a3f" font-family="Courier New, monospace" font-weight="bold" font-size="13">VERIFICATION OUTCOME: ALL DIFFERENCES &lt;= 1.13e-10 &lt;&lt; 1e-5  [PASSED 100%]</text>
<text x="95" y="419" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">5. SIMULTANEOUS GRADIENT DESCENT PARAMETER UPDATE (eta = 0.1)</text>
<line x1="95" y1="423" x2="770" y2="423" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="444" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Rule: theta^(1) = theta^(0) - eta * (dJ/dtheta) using original Step 0 gradients:</text>
<rect x="110" y="450" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="471" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">w^(1) = 0.50000000 - 0.1 * (-1.20946448) = 0.5 + 0.12094645 = 0.62094645</text>
<rect x="110" y="486" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="507" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">b^(1) = 0.00000000 - 0.1 * (-1.20946448) = 0.0 + 0.12094645 = 0.12094645</text>
<rect x="110" y="522" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="543" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">v^(1) = 1.00000000 - 0.1 * (-0.71068205) = 1.0 + 0.07106821 = 1.07106820</text>
<rect x="95" y="558" width="675" height="34" fill="#f2e6d6" stroke="#a86839" stroke-width="1" rx="4"/>
<text x="110" y="580" fill="#835a3f" font-family="Courier New, monospace" font-weight="bold" font-size="13">c^(1) = 0.00000000 - 0.1 * (-1.53788284) = 0.0 + 0.15378828 = 0.15378828</text>
<text x="95" y="633" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">6. ENGINEERING EXPLANATION OF GRADIENT DIRECTION</text>
<line x1="95" y1="637" x2="770" y2="637" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="658" fill="#1f2937" font-family="Courier New, monospace" font-size="12">1. Prediction Deficiency: y_hat(0) ~= 0.462 is smaller than target y = 2.0.</text>
<text x="95" y="682" fill="#1f2937" font-family="Courier New, monospace" font-size="12">   Residual (y_hat - y) = -1.538 is negative (underprediction).</text>
<text x="95" y="706" fill="#1f2937" font-family="Courier New, monospace" font-size="12">2. Positive Sensitivity: Since v > 0 and h > 0, increasing any parameter</text>
<text x="95" y="730" fill="#1f2937" font-family="Courier New, monospace" font-size="12">   (w, b, v, c) increases y_hat, directly driving it towards the target 2.0.</text>
<text x="95" y="754" fill="#1f2937" font-family="Courier New, monospace" font-size="12">3. Negative Gradient: Because increasing parameters decreases loss J,</text>
<text x="95" y="778" fill="#1f2937" font-family="Courier New, monospace" font-size="12">   all partial derivatives dJ/dtheta are strictly negative.</text>
<text x="95" y="802" fill="#1f2937" font-family="Courier New, monospace" font-size="12">4. Positive Step: Gradient descent updates Delta_theta = -eta * dJ/dtheta > 0.</text>
<text x="95" y="826" fill="#1f2937" font-family="Courier New, monospace" font-size="12">   Thus, all four parameters increase, ensuring monotonic loss convergence.</text>
<rect x="95" y="832" width="675" height="34" fill="#f2e6d6" stroke="#a86839" stroke-width="1" rx="4"/>
<text x="110" y="854" fill="#835a3f" font-family="Courier New, monospace" font-weight="bold" font-size="13">100-STEP OUTCOME: Loss monotonically descends from 1.1825 to 1.70e-20.</text>
