<rect x="80" y="35" width="710" height="55" fill="none" stroke="#9c6844" stroke-width="1.5"/>
<text x="95" y="60" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="15">PASS SCIENCE WORKS | R&amp;D INTERNSHIP ASSESSMENT 2026</text>
<text x="95" y="80" fill="#9c6844" font-family="Courier New, monospace" font-size="12">TASK F: BACKPROPAGATION DERIVATION &#8212; PAGE 1 OF 2</text>
<text x="780" y="80" fill="#9c6844" font-family="Courier New, monospace" font-size="12" text-anchor="end">DATE: 2026-11-10</text>
<text x="95" y="145" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">1. PROBLEM SPECIFICATION &amp; ARCHITECTURE</text>
<line x1="95" y1="149" x2="770" y2="149" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="170" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Single regression specimen: x = 1.0, target y = 2.0</text>
<rect x="110" y="176" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="197" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">z = w*x + b,   h = tanh(z),   y_hat = v*h + c</text>
<rect x="110" y="212" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="233" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">Loss J = 0.5 * (y_hat - y)^2</text>
<text x="95" y="266" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Initial values: w=0.5, b=0.0, v=1.0, c=0.0, learning rate eta = 0.1</text>
<text x="95" y="305" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">2. STEP 0 FORWARD PASS (STEP-BY-STEP NUMERICAL EVALUATION)</text>
<line x1="95" y1="309" x2="770" y2="309" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="330" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Pre-activation z:</text>
<rect x="110" y="336" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="357" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">z = (0.5)*(1.0) + 0.0 = 0.50000000</text>
<text x="95" y="390" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Hidden activation h = tanh(z):</text>
<rect x="110" y="396" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="417" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">h = tanh(0.5) = (e^0.5 - e^-0.5)/(e^0.5 + e^-0.5) = 0.46211716</text>
<text x="95" y="450" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Prediction y_hat = v*h + c:</text>
<rect x="110" y="456" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="477" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">y_hat = (1.0)*(0.46211716) + 0.0 = 0.46211716</text>
<text x="95" y="510" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Residual error e = y_hat - y:</text>
<rect x="110" y="516" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="537" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">e = 0.46211716 - 2.00000000 = -1.53788284</text>
<text x="95" y="570" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Step 0 Mean Squared Error Loss:</text>
<rect x="95" y="576" width="675" height="34" fill="#f2e6d6" stroke="#a86839" stroke-width="1" rx="4"/>
<text x="110" y="598" fill="#835a3f" font-family="Courier New, monospace" font-weight="bold" font-size="13">J_0 = 0.5 * (-1.53788284)^2 = 1.18254182</text>
<text x="95" y="651" fill="#b91c1c" font-family="Courier New, monospace" font-weight="bold" font-size="14">3. ANALYTICAL CHAIN-RULE GRADIENT DERIVATION</text>
<line x1="95" y1="655" x2="770" y2="655" stroke="#b91c1c" stroke-width="1"/>
<text x="95" y="676" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Gradient w.r.t Output Bias c:</text>
<rect x="110" y="682" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="703" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">dJ/dc = (dJ/dy_hat) * (dy_hat/dc) = (y_hat - y) * 1 = -1.53788284</text>
<text x="95" y="736" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Gradient w.r.t Output Weight v:</text>
<rect x="110" y="742" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="763" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">dJ/dv = (dJ/dy_hat) * (dy_hat/dv) = (y_hat - y) * h = -0.71068205</text>
<text x="95" y="796" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Backpropagation to Hidden Layer (d/dz tanh(z) = 1 - h^2):</text>
<rect x="110" y="802" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="823" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">dh/dz = 1 - (0.46211716)^2 = 1 - 0.21355227 = 0.78644773</text>
<rect x="110" y="838" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="859" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">dJ/dz = (dJ/dy_hat) * v * (1 - h^2) = (-1.53788284)*(1.0)*(0.78644773) = -1.20946448</text>
<text x="95" y="892" fill="#1f2937" font-family="Courier New, monospace" font-size="12">Gradients w.r.t Hidden Bias b and Weight w:</text>
<rect x="110" y="898" width="650" height="30" fill="rgba(254,240,138,0.3)" stroke="none" rx="4"/>
<text x="130" y="919" fill="#9c6844" font-family="Courier New, monospace" font-weight="bold" font-size="13">dJ/db = dJ/dz * 1 = -1.20946448</text>
<rect x="95" y="934" width="675" height="34" fill="#f2e6d6" stroke="#a86839" stroke-width="1" rx="4"/>
<text x="110" y="956" fill="#835a3f" font-family="Courier New, monospace" font-weight="bold" font-size="13">dJ/dw = dJ/dz * x = (-1.20946448)*(1.0) = -1.20946448</text>
